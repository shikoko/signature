name: Website

# Publishes the site to GitHub Pages on every push to main. Copied signatures link to the
# files in icons/v1/, so nothing is published if one of them was changed, moved or deleted.
# Only the page's own files are published, not tools/ or the repository's notes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one waits instead of cancelling one that's running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check that published icons haven't changed
        run: node .github/scripts/check-icons.mjs

      - name: Collect the site's files
        run: |
          mkdir _site
          cp -R index.html styles.css signature.js app.js assets icons _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
